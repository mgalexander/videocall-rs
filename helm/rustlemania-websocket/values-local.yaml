# Local k3d overlay for helm/rustlemania-websocket.
#
# Differences from helm/rustlemania-websocket/values.yaml (production):
#   - image points at the local k3d registry (localhost:5000) with the
#     :dev tag built by helm/local/up.sh from Dockerfile.actix.
#   - pullPolicy: IfNotPresent because images are side-loaded via
#     `k3d image import`.
#   - env block overridden in full to point UI_ENDPOINT at the local UI
#     host. NATS_USER/PASSWORD wiring is identical to the production
#     overlay (optional secretKeyRef into nats-credentials).
#   - ingress targets ws.videocall.local with local-selfsigned.

image:
  repository: localhost:5000/videocall-media-server
  pullPolicy: IfNotPresent
  tag: dev

env:
  - name: RUST_LOG
    value: info
  - name: ACTIX_PORT
    value: "8080"
  - name: UI_ENDPOINT
    value: https://app.videocall.local
  - name: NATS_URL
    value: nats:4222
  - name: TOKIO_WORKER_THREADS
    value: "1"
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: jwt-secret
        key: secret
  - name: NATS_USER
    valueFrom:
      secretKeyRef:
        name: nats-credentials
        key: user
        optional: true
  - name: NATS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nats-credentials
        key: password
        optional: true
  - name: NATS_TLS
    value: "false"
  - name: NATS_TLS_CA
    value: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    # NOTE: cluster-issuer, NOT issuer (see meeting-api values-local.yaml).
    cert-manager.io/cluster-issuer: local-selfsigned
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Explicitly drop the production annotations (Helm merges maps).
    cert-manager.io/issuer: null
    kubernetes.io/tls-acme: null
  hosts:
    - host: ws.videocall.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: rustlemania-websocket
            port:
              number: 8080
  tls:
    - secretName: rustlemania-websocket-local-tls
      hosts:
        - ws.videocall.local
