# helm/local/manifests/load-test-job.yaml
#
# In-cluster load-test driver Job. The bot crate (built into
# localhost:5000/videocall-bot:dev by helm/local/load-test.sh) runs as a
# single-Pod Job that dials the SFU at its in-cluster headless Service DNS
# name and emits a single JSON summary on stdout.
#
# Why a Job (not a Deployment): the bot exits cleanly after
# `--duration` seconds. The Job's Pod logs are then captured by
# helm/local/load-test.sh and piped into scripts/eval-load-test.py.
#
# The Job uses a ConfigMap (`load-test-config`) for parameters so we can
# vary the bot configuration without re-rendering this manifest. The
# ConfigMap is applied by helm/local/load-test.sh before this Job is
# (re-)created.
#
# Why no JWT injection: the local SFU runs with `SFU_MODE=sfu` and the
# test rooms used here are not gated by auth on the WebTransport path
# (the JWT path is exercised by meeting-api endpoints, not the SFU
# subscribe handshake). If that ever changes, plumb a JWT through the
# load-test-config ConfigMap by adding TOKEN env and `--token "$TOKEN"`
# to the bot args once the bot CLI grows that flag.
#
# Resource sizing: the requests are deliberately small so this Job can
# co-schedule with the SFU pods on the same k3d agent. The limits are
# generous (4 CPU / 4Gi) because 50 bots in a single process spin up a
# lot of tokio tasks and VP9 encoder state — running into the cgroup
# limit silently throttles audio cadence and inflates listener drops.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
  namespace: default
  labels:
    app.kubernetes.io/name: videocall-load-test
    app.kubernetes.io/component: bot
spec:
  backoffLimit: 0
  # 15 min hard cap. The release-gate run is 5 min of steady-state plus
  # bot ramp-up; 15 min gives us headroom while still bounding a stuck
  # Job from blocking the gate forever.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: videocall-load-test
        app.kubernetes.io/component: bot
    spec:
      restartPolicy: Never
      # netem init container: applies `tc qdisc … netem …` to eth0 in the
      # Pod's network namespace BEFORE the bot starts. Init and main
      # containers share the network namespace, so the qdisc installed
      # here shapes the bot container's egress traffic too.
      #
      # Image choice: nicolaka/netshoot ships iproute2 (tc) and is the
      # smallest known-good option that's reliable in CI. agnhost does
      # not ship tc on all tags; debian:bookworm-slim would need an
      # apt-get install at runtime which is non-deterministic in air-
      # gapped CI. netshoot pins everything we need at image-build time.
      initContainers:
        - name: netem-init
          image: nicolaka/netshoot:v0.13
          imagePullPolicy: IfNotPresent
          # NETEM_PROFILE is sourced from the same ConfigMap as the bot.
          envFrom:
            - configMapRef:
                name: load-test-config
          # Inline script — small enough to audit at the manifest layer
          # without adding another ConfigMap. Profiles are a literal table
          # so unknown profiles are rejected loudly (no silent unshaped
          # runs masquerading as shaped ones).
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              PROFILE="${NETEM_PROFILE:-clean}"
              echo "[netem-init] requested profile: ${PROFILE}"
              # Profile set must match VALID_NETEM_PROFILES in
              # helm/local/load-test.sh — keep both ends in sync.
              case "${PROFILE}" in
                clean)
                  # No shaping — preserves CI behavior (50-bot merge gate,
                  # 200-bot release gate). Exit 0 with no qdisc applied.
                  echo "[netem-init] no shaping applied (clean profile)"
                  exit 0
                  ;;
                wifi)
                  # Typical home Wi-Fi: 30ms ± 10ms delay, 0.5% loss.
                  DELAY_MS=30; JITTER_MS=10; LOSS_PCT=0.5
                  ;;
                mobile)
                  # 4G/LTE: 80ms ± 20ms delay, 1% loss.
                  DELAY_MS=80; JITTER_MS=20; LOSS_PCT=1
                  ;;
                lossy)
                  # Congested / poor link: 50ms ± 15ms delay, 3% loss.
                  DELAY_MS=50; JITTER_MS=15; LOSS_PCT=3
                  ;;
                transcontinental)
                  # US <-> EU long-haul: 200ms ± 30ms delay, 0.2% loss.
                  DELAY_MS=200; JITTER_MS=30; LOSS_PCT=0.2
                  ;;
                *)
                  echo "[netem-init] ERROR: unknown NETEM_PROFILE '${PROFILE}'" >&2
                  echo "[netem-init] valid profiles: clean, wifi, mobile, lossy, transcontinental" >&2
                  exit 1
                  ;;
              esac
              echo "[netem-init] applying: tc qdisc add dev eth0 root netem delay ${DELAY_MS}ms ${JITTER_MS}ms loss ${LOSS_PCT}%"
              tc qdisc add dev eth0 root netem delay "${DELAY_MS}ms" "${JITTER_MS}ms" loss "${LOSS_PCT}%"
              echo "[netem-init] active qdisc:"
              tc qdisc show dev eth0
          securityContext:
            # Needs NET_ADMIN to install qdiscs. Runs as root (uid 0)
            # because tc requires it; this is scoped to the init phase
            # only — the bot container keeps its hardened non-root
            # securityContext below.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: "10m"
              memory: 16Mi
            limits:
              cpu: "100m"
              memory: 64Mi
      containers:
        - name: bot
          image: localhost:5000/videocall-bot:dev
          imagePullPolicy: IfNotPresent
          # The bot CLI accepts long flags; we wire them from the
          # ConfigMap via envFrom + a shell-expanded args vector. Using
          # `sh -lc` keeps the env expansion in a single layer and
          # avoids shell-injection surface (every value is a numeric or
          # a controlled string set by load-test.sh).
          command:
            - /bin/sh
            - -lc
            - >-
              exec /usr/local/bin/bot
              --orchestrate
              --room "${ROOM}"
              --senders "${SENDERS}"
              --listeners "${LISTENERS}"
              --duration "${DURATION_S}"
              --server-url "${SERVER_URL}"
              --insecure
              --audio-path /app/BundyBests2.wav
              --image-dir /app
          envFrom:
            - configMapRef:
                name: load-test-config
          env:
            - name: RUST_LOG
              value: info,quinn=warn
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
