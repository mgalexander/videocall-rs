apiVersion: v1
kind: Service
metadata:
  name: websocket-headless
  labels:
    {{- include "rustlemania.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "rustlemania.selectorLabels" . | nindent 4 }}
  ports:
    - name: websocket
      port: 8080
      targetPort: 8080
      protocol: TCP
