# Default values for rustlemania.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
nameOverride: ""
fullnameOverride: ""


replicaCount: 1
image:
  repository: securityunion/videocall-media-server
  pullPolicy: Always
  tag: high-availability-cf63fcce
env:
  - name: RUST_LOG
    value: info
  - name: ACTIX_PORT
    value: "8080"
  - name: UI_ENDPOINT
    value: https://rustlemania.com
  - name: NATS_URL
    value: nats:4222
  - name: TOKIO_WORKER_THREADS
    value: "1"  # Default for WebSocket services - adjust per region as needed
  # JWT_SECRET must match the secret used by meeting-api to sign room access tokens.
  # Create the secret with: kubectl create secret generic jwt-secret --from-literal=secret=<value>
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: jwt-secret
        key: secret
  # NATS basic auth (sfu-update/audits/nats-acl-audit.md). Same Secret as
  # the webtransport chart; safe to leave Secret absent for back-compat
  # (env vars resolve empty -> actix-api uses no-auth).
  #   kubectl create secret generic nats-credentials \
  #       --from-literal=user=<user> --from-literal=password=<password>
  - name: NATS_USER
    valueFrom:
      secretKeyRef:
        name: nats-credentials
        key: user
        optional: true
  - name: NATS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nats-credentials
        key: password
        optional: true
  - name: NATS_TLS
    value: "false"
  - name: NATS_TLS_CA
    value: ""
resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "32Mi"
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8080
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: api.rustlemania.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: rustlemania-websocket
            port:
              number: 8080
  tls:
    - secretName: rustlemania-websocket-tls
      hosts:
        - api.rustlemania.com
