apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rustlemania.fullname" . }}
  labels:
    {{- include "rustlemania.labels" . | nindent 4 }}
spec:
  serviceName: websocket-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rustlemania.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rustlemania.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "rustlemania.fullname" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # vc-el0: StatefulSet name (pod-name prefix) for the per-pod
            # redirect FQDN. Must match this chart's fullname so redirected
            # clients resolve {workload}-N.{tk}-headless.{ns}.svc.cluster.local.
            - name: SFU_WORKLOAD_NAME
              value: "{{ include "rustlemania.fullname" . }}"
            - name: STATEFULSET_REPLICAS
              value: "{{ .Values.replicaCount }}"
            {{- toYaml .Values.env | nindent 12 }}
          ports:
            - name: ws-api
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Process-liveness check on /healthz (currently a static 200; not
          # yet forwarding-aware — see vc-sfu-failfast-panic). Pull a pod
          # whose HTTP server stops responding from Service endpoints
          # quickly (~20s of sustained failure).
          readinessProbe:
            httpGet:
              path: /healthz
              port: ws-api
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # Restart a pod whose HTTP server is wedged within a bounded
          # window (~75s of sustained failure) without flapping under brief
          # load spikes. Does not detect NATS-disconnect failures yet.
          livenessProbe:
            httpGet:
              path: /healthz
              port: ws-api
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
