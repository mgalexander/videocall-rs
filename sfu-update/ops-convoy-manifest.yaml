# sfu-update/ops-convoy-manifest.yaml
#
# Machine-readable DAG for the videocall_ops gastown rig (prefix vco-).
# Sibling of convoy-manifest.yaml (the dev-rig manifest), per the plan's
# "Operating model: overseer + dev rig + ops rig" section.
#
# Consumed by sfu-update/scripts/materialize-ops.sh, which invokes
# materialize.py with overridden --manifest / --state / --jsonl args.
# State (key → bd id mapping) lives at sfu-update/.materialize-state.ops.json.
#
# Scope of this manifest: ONLY ops-side work. Code beads live in
# convoy-manifest.yaml. The two rigs share the same upstream branch
# (experimental-sfu) but materialise into separate Dolt databases
# (/gt/videocall/.beads/ vs /gt/videocall_ops/.beads/).
#
# Currently materialises: ops umbrella epic + Track 2 (local K8s stack)
# initial beads. Later phases (per-phase ops validation in Track 3) are
# added incrementally as each dev phase closes.

prefix: vco

epics:
  - key: ops-epic
    type: epic
    title: "videocall_ops: local K8s stack lifecycle + per-phase validation"
    summary: |
      Umbrella tracking issue for the videocall_ops rig. Owns the local
      k3d cluster bringup/down/redeploy lifecycle, per-phase deployment
      and integration validation of dev-rig artifacts, and serves as
      the template for "standing up a totally new small production rig"
      per the user's stated rationale (sfu-update/PLAN.md "Operating
      model: overseer + dev rig + ops rig"). Persistent: keeps running
      while the videocall rig is parked between phases.

      Cross-rig handoff per "Phase sequencing (race avoidance)" in the
      plan: dev rig closes phase → ops rig deploys + validates → ops
      mails dev rig "go" → next phase opens.

convoys:
  - key: T2-local-k8s
    title: "Track 2 — Local K8s stack (k3d-based) for the SFU"
    parent_epic: ops-epic
    summary: |
      Stand up a small, production-like Kubernetes cluster on this host
      via k3d, deploy the SFU stack via the existing helm/ charts (with
      local overlays), and produce the bringup/teardown/redeploy scripts
      that are reusable for future fresh production clusters.
    tracks: [vco-1, vco-2, vco-3, vco-4, vco-5, vco-6, vco-7]

beads:
  - key: vco-1
    type: feature
    title: "Author helm/local/up.sh v0 — create k3d cluster with kubectl context"
    summary: |
      Author the first piece of the local K8s lifecycle: a focused
      `helm/local/up.sh` (v0) that does ONLY the cluster bringup.
      Scope:

        - Verify k3d is installed (binary on PATH); if not, log a clear
          install hint (`brew install k3d` / curl-install URL) and exit
          non-zero. Don't auto-install — that's an operator decision.
        - Create a k3d cluster named "videocall-local" with 1 control
          plane + 2 worker nodes. Use the local image registry feature
          (`--registry-create videocall-local-registry:0.0.0.0:5000`)
          so subsequent beads can `docker push localhost:5000/...` and
          `k3d image import` for fast inner-loop redeploys.
        - Disable k3d's bundled traefik ingress (we'll install our own
          ingress-nginx via helm in a later bead): `--k3s-arg
          "--disable=traefik@server:0"`.
        - Wait for `kubectl get nodes` to return 3 Ready nodes.
        - Print the kubeconfig context name (e.g. `k3d-videocall-local`)
          so subsequent scripts can target it via KUBECONTEXT.
        - Idempotent: if the cluster already exists, log "already up"
          and exit 0.

      ALSO author a minimal `helm/local/README.md` documenting the
      cluster shape and the convention for the rest of the local stack
      (later beads land ingress, cert-manager, NATS, postgres,
      meeting-api, SFU pods). Reference back to sfu-update/PLAN.md
      "Local deployment stack" for the full scope.

      Out of scope: deploying any application services. That's vco-2+.

      Commit on experimental-sfu via the Refinery's normal merge queue.
      Commit message: `feat(ops): helm/local/up.sh v0 — k3d cluster bringup`.
    parent_epic: ops-epic
    blocked_by: []

  - key: vco-2
    type: feature
    title: "Author helm/local/down.sh + pause.sh"
    summary: |
      Companion teardown + hibernate scripts:
        - down.sh: `k3d cluster delete videocall-local`. Removes the
          local registry too. Idempotent (no-op if cluster absent).
        - pause.sh: `k3d cluster stop videocall-local`. Keeps state,
          stops compute. Companion `resume.sh` (or `up.sh --resume`)
          if not already covered by vco-1's idempotency.
      Smoke-test up → pause → up-resume → down end-to-end.
    parent_epic: ops-epic
    blocked_by: [vco-1]

  - key: vco-3
    type: feature
    title: "Install ingress-nginx + cert-manager into the local cluster"
    summary: |
      Extend `helm/local/up.sh` (v1) to deploy:
        - ingress-nginx via the existing `helm/ingress-nginx/` chart
          with a `values-local.yaml` overlay (NodePort or hostPort, not
          LoadBalancer — k3d's loadbalancer is shoddy).
        - cert-manager via `helm/cert-manager/`.
        - A self-signed ClusterIssuer via `helm/cert-manager-issuer/`
          for local `*.videocall.local` certificates.

      Validation: `kubectl get pods -n ingress-nginx` shows Ready;
      `kubectl get clusterissuer` shows the issuer Ready.
    parent_epic: ops-epic
    blocked_by: [vco-1]

  - key: vco-4
    type: feature
    title: "Install NATS (with auth) + postgres into the local cluster"
    summary: |
      Author `helm/global/local/nats/` (sibling of us-east/singapore),
      single-replica, auth enabled from day one with a dev credential
      from `helm/local/.env.example` (real Secret created by up.sh from
      that template, NOT committed). Install via helm.

      Install postgres via the existing `helm/postgres/` chart with a
      values-local.yaml overlay (single-node, ephemeral storage).

      Validation: `kubectl exec nats-0 -- nats sub --server=... '>'`
      with creds works, without creds is refused (mirrors the auth
      matrix from docker/docker-compose.nats-dev.yaml against a real
      K8s NATS).
    parent_epic: ops-epic
    blocked_by: [vco-1, vco-3]

  - key: vco-5
    type: feature
    title: "Deploy meeting-api + SFU pods (webtransport + websocket) locally"
    summary: |
      Build local container images from the videocall codebase
      (`Dockerfile.actix`, `Dockerfile.meeting-api`), push to the k3d
      registry, helm install meeting-api + rustlemania-{webtransport,
      websocket} with values-local.yaml overlays. Wire the nats-credentials
      Secret per sfu-update/audits/nats-auth-rollout.md Phase A pattern.

      Validation: `curl https://transport.videocall.local/healthz`
      (after /etc/hosts entry); SFU pod logs show "Connected to NATS
      at ... auth=on".
    parent_epic: ops-epic
    blocked_by: [vco-4]

  - key: vco-6
    type: feature
    title: "Author helm/local/redeploy.sh — fast inner-loop image+helm refresh"
    summary: |
      Author redeploy.sh that:
        - Rebuilds container images for changed Rust crates (incremental
          cargo build inside the dev image).
        - Pushes to the k3d local registry.
        - `k3d image import` to nodes (faster than registry pull for
          small clusters).
        - `helm upgrade` the SFU charts.
        - Waits for rollout to complete.
        - Tails pod logs for ~5s to surface immediate errors.

      Used after each dev-rig phase merges to experimental-sfu, per the
      Track 3 ops-validation cadence. Per ADR-0008, the overseer (not a
      polecat) invokes this script against k3d-videocall-local — polecats
      author it, the overseer runs it.
    parent_epic: ops-epic
    blocked_by: [vco-5]

  - key: vco-7
    type: task
    title: "End-to-end validation + 'new production rig template' doc"
    summary: |
      End-to-end smoke: bring cluster up, deploy full stack, run the
      nats-auth-phase-d-validate.sh probe against KUBECTX=k3d-videocall-local,
      teardown.

      Expand helm/local/README.md into the "totally new small production
      rig template" per the user's stated goal (sfu-update/PLAN.md
      "Local deployment stack"): document each value override point with
      a note like "for prod, set <X> to <Y>". Future fresh prod
      deployments follow this README + a small overrides file.
    parent_epic: ops-epic
    blocked_by: [vco-1, vco-2, vco-3, vco-4, vco-5, vco-6]

  # ===========================================================================
  # F0 — Follow-up beads filed during execution (no convoy; pick up when idle)
  # ===========================================================================

  - key: f0-hook-routing-wrapper
    type: task
    title: "Author sling-hook-wrapper to paper over gastown hook-routing bug"
    summary: |
      Every time we sling work into a polecat (videocall and
      videocall_ops alike), the wisp produced by `gt sling` or
      `gt convoy launch` fails to land on the polecat's hook
      automatically. The polecat session spawns, primes, sees an empty
      hook, and self-defers. Every time the recovery is the same dance:

          gt hook <bead> <rig>/polecats/<polecat-name>
          gt session restart <rig>/<polecat-name>

      Hit three times now: videocall bootstrap (vc-c4e.1), the first
      ops sling (vco-ow8.1), and Wave 2 auto-dispatch from the daemon
      (vco-ow8.2 + vco-ow8.3 — both jasper and quartz deferred with
      empty hooks). The convoy daemon's "event-driven feed" promise
      doesn't survive contact with the hook attachment step.

      Authoritative fix is upstream in gastown (bug in `gt sling`'s
      wisp formula, or in how `pool-init` registers polecat identities
      — the `SetAgentState: issue not found` retry warnings during
      pool-init are likely related). That's outside this rig's scope.

      This bead authors a LOCAL WRAPPER that papers over the bug for
      our rigs:

          sfu-update/scripts/gt-sling-attached.sh <bead-id> <rig>/<polecat>

      Does:
        1. `gt hook <bead-id> <rig>/polecats/<polecat>` — attach.
        2. `gt session restart <rig>/<polecat>` — cycle so the polecat
           re-primes and picks up the hook.
        3. Verify via `gt hook show <rig>/polecats/<polecat>` —
           non-empty means success.
        4. If empty after step 3, exit non-zero with a clear message.

      Also: update the convoy launch ritual in sfu-update/PLAN.md
      "Convoy launch protocol" to recommend `gt-sling-attached.sh`
      instead of bare `gt sling` until the upstream bug is fixed.

      Optional stretch: a `gt convoy launch-attached <convoy-id>`
      style wrapper that walks Wave 1 of a convoy and calls the
      single-bead wrapper for each. Out of scope for the first cut.

      Reference incidents: sfu-update/ops-log.md entries for the
      videocall bootstrap and the videocall_ops Track 2 launch.
    parent_epic: ops-epic
    blocked_by: []

  - key: vco-9-postgres-chart-rewrite
    type: feature
    title: "Rewrite helm/postgres to thin chart on docker.io/postgres:16-alpine"
    summary: |
      Drop the bitnami postgresql 12.5.7 subchart entirely and author a
      small in-repo chart targeting the official postgres image.

      Why: The bitnami chart pinned to
      `bitnami/postgresql:15.3.0-debian-11-r7`, which Bitnami unpublished
      in their 2025 free-tier deprecation (tags moved to `bitnamilegacy/`,
      no patches). A stopgap override pinning to
      `bitnamilegacy/postgresql:15.3.0-debian-11-r7` is in place (commit
      7791bac), but that's a known-stale unsupported image — actively
      misleading as a "production rig template," which is one of the
      stated goals of the local stack (sfu-update/PLAN.md "Local
      deployment stack"). See PLAN.md "Postgres image decision (added
      2026-05-16)" for the full rationale.

      Target image: `docker.io/postgres:16-alpine`. Permissive license,
      ~150 MB, weekly security patches, clear production lineage (same
      image runs inside managed-postgres offerings).

      ## Wire-format constraints THIS REWRITE MUST PRESERVE

      1. Service name `postgres-postgresql` — `helm/meeting-api/values.yaml`
         line 19-20 wires `DATABASE_URL=postgres://...@postgres-postgresql:5432/...`.
         Renaming breaks meeting-api in local AND production.
      2. The `postgres-credentials` Secret has keys `password` and
         `postgres-password` (created by `helm/local/up.sh` from `.env`,
         both keys contain the same value). Map `POSTGRES_PASSWORD`
         env from `secretKeyRef: { name: postgres-credentials, key: password }`.
      3. `auth.username` and `auth.database` stay configurable via values
         (local uses `rustlemania`/`rustlemania`; production uses
         `postgres`/`actix-api-db` per `helm/postgres/values.yaml`).
      4. Local overlay continues to set `persistence.enabled=false`
         (ephemeral storage); production overlay would set it true with
         a PVC.

      ## Files to modify / create / delete

      Modify:
        - helm/postgres/Chart.yaml: drop the `dependencies:` block
          referencing bitnami. Keep `apiVersion: v2`, `name`, `version`.
        - helm/postgres/values.yaml: rewrite for the new chart surface.
          New shape (suggested):
            image:
              repository: docker.io/postgres
              tag: 16-alpine
              pullPolicy: IfNotPresent
            auth:
              existingSecret: rustlemania  # production secret name
              database: actix-api-db
              username: postgres
              # secretKeys: { adminPasswordKey: postgres-password,
              #               userPasswordKey: postgres-password }
            service:
              name: postgres-postgresql    # MUST stay
              port: 5432
            persistence:
              enabled: true
              size: 10Gi
            resources: {}                  # production sizing
        - helm/postgres/values-local.yaml: drop the bitnamilegacy
          `postgresql.image.*` override (from commit 7791bac). Restate
          for the new chart shape:
            auth:
              existingSecret: postgres-credentials
              database: rustlemania
              username: rustlemania
            persistence:
              enabled: false
            resources:
              limits: { cpu: 250m, memory: 256Mi }
              requests: { cpu: 100m, memory: 128Mi }

      Delete:
        - helm/postgres/Chart.lock (referenced the bitnami dep)
        - helm/postgres/charts/postgresql-12.5.7.tgz (pulled subchart)

      Create:
        - helm/postgres/templates/statefulset.yaml — 1 replica
          StatefulSet named `{{ .Release.Name }}-postgresql`
          (matches the bitnami naming so the Service can keep the
          `postgres-postgresql` name without a label-selector mismatch).
          Container env from existingSecret:
            POSTGRES_DB:       {{ .Values.auth.database }}
            POSTGRES_USER:     {{ .Values.auth.username }}
            POSTGRES_PASSWORD: { valueFrom: { secretKeyRef: { name: .Values.auth.existingSecret, key: password } } }
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
          Mount /var/lib/postgresql/data (PGDATA) via volumeClaimTemplates
          when persistence.enabled; otherwise emptyDir.
          Readiness probe: `pg_isready -U $POSTGRES_USER -d $POSTGRES_DB`.
        - helm/postgres/templates/service.yaml — ClusterIP Service
          name `{{ .Values.service.name | default "postgres-postgresql" }}`,
          port 5432 → containerPort 5432, selector matching the StatefulSet.

      ## Verification

      Run from /mnt/llms/videocall on the host (k3d cluster already up
      per the local bootstrap):

        helm --kube-context k3d-videocall-local uninstall postgres -n default
        bash helm/local/up.sh

      Expected:
        - postgres pod Ready within 60s, no ImagePullBackOff.
        - kubectl exec -it postgres-postgresql-0 -n default -- \
              psql -U rustlemania -d rustlemania -c '\\dt'
          returns a prompt (db reachable, user authenticated).
        - kubectl logs -n default deploy/meeting-api --tail=50
          shows no DATABASE_URL connection errors.
        - helm/local/down.sh + bash helm/local/up.sh from a clean state
          still passes.

      ## Out of scope

      CloudNativePG operator (filed as a future ADR consideration —
      heavier setup, only pays off when modeling production HA).

      Commit on experimental-sfu via Refinery merge.
      Commit message: `feat(ops): helm/postgres on official postgres:16-alpine (vco-9)`.
    parent_epic: ops-epic
    blocked_by: []

  - key: vco-10-postgres-redeploy
    type: task
    title: "Redeploy postgres on the local cluster (drop bitnamilegacy stopgap, install rewritten chart)"
    summary: |
      The chart rewrite (vco-9-postgres-chart-rewrite, commit 642d4ba)
      is on disk but NOT yet deployed to the running k3d cluster. The
      cluster's `postgres` Helm release is still on the bitnamilegacy
      stopgap (commit 7791bac, bitnamilegacy/postgresql:15.3.0-debian-11-r7).
      This bead does the swap.

      ## Timing — wait for a natural pause

      DO NOT pick this bead up immediately. It involves a ~60s data-
      plane interruption (postgres drops, meeting-api loses its DB
      connection, both come back). Per sfu-update/PLAN.md "Postgres
      redeploy timing", run when BOTH:

        1. No polecat is currently HOOKED to a bead that touches
           meeting-api or postgres. Doc/proto/UI beads are fine.
        2. No active "phase validation" run is in flight (i.e. the ops
           rig isn't mid-Track-3 against a closed dev phase).

      The cleanest trigger is: all ops + dev polecats simultaneously
      idle (hooks empty across both rigs). That's the green light.

      ## Procedure (run from /mnt/llms/videocall on the host)

      ```bash
      # 1. Confirm working tree clean (Refinery's updateInstead push
      #    contract requires it — see ADR-0006 revised 2026-05-16):
      git -C /mnt/llms/videocall status --short

      # 2. Uninstall the bitnamilegacy Helm release (drops the old
      #    StatefulSet + pod):
      helm --kube-context k3d-videocall-local uninstall postgres -n default

      # 3. Re-run up.sh; cluster + ingress + cert-manager + NATS skip
      #    (idempotent); only the postgres install actually runs:
      bash helm/local/up.sh

      # 4. Verify:
      kubectl --context k3d-videocall-local get pods -n default
      kubectl --context k3d-videocall-local exec -it postgres-postgresql-0 \
          -n default -- psql -U rustlemania -d rustlemania -c '\dt'
      kubectl --context k3d-videocall-local logs -n default \
          deploy/meeting-api --tail=30 | grep -iE "connection|database"
      ```

      Expected outcomes:
        - `postgres-postgresql-0` pod Ready within 60s, image is now
          `docker.io/postgres:16-alpine` (not bitnamilegacy/*).
        - `psql` connects with the `rustlemania` user; `\dt` returns
          a prompt (db reachable, auth works).
        - meeting-api pod flaps once during the swap, then reconnects;
          `kubectl logs` shows no lingering DATABASE_URL errors.

      ## Watch-for / known sharp edges

      - If `helm uninstall` hangs: usually a StatefulSet PVC finalizer.
        But persistence is OFF in values-local.yaml, so there's no PVC.
        Escape hatch: `kubectl delete statefulset postgres-postgresql
        -n default --force`.
      - meeting-api's `meeting-api-db` Secret is unchanged (host, port,
        credentials all identical). The pod just needs DNS re-resolve.
      - If the working tree is dirty when this runs and another polecat
        lands work mid-redeploy, the Refinery's `updateInstead` push
        will be rejected and stack up in the merge queue. Recovery:
        clean the tree, then `gt mq retry` (or wait for daemon retry).

      ## Owning rig

      `videocall_ops`. Sling via `sfu-update/scripts/gt-sling-attached.sh`
      to whichever ops polecat is idle when the pause window opens.

      ## Out of scope

      Schema migrations, data migrations, pg_dump/restore. Local
      persistence is OFF, so there's no data to preserve. For production
      a `pg_dump` → re-install → `pg_restore` would be needed; that's a
      separate consideration when we model a real production rig with
      `persistence.enabled=true`.

      Commit message on close: `chore(ops): redeploy postgres on local
      cluster with official postgres:16-alpine chart (vco-10)`.
    parent_epic: ops-epic
    blocked_by: [vco-9-postgres-chart-rewrite]

  - key: f0-polecat-cluster-access
    type: feature
    title: "Give polecat sandboxes a path to reach the local k3d cluster"
    summary: |
      Discovered during vco-ow8.10 (postgres redeploy). Polecat sandboxes
      inside `gastown-sandbox` have NO way to reach the local k3d cluster
      on the host:

        - No docker socket mounted (cannot run `docker exec` or
          `k3d kubeconfig` to bootstrap a context).
        - No kubeconfig in the sandbox filesystem (host's
          `~/.kube/config` isn't mounted in).
        - No `kubectl` / `helm` / `k3d` binaries in the sandbox image
          (we installed them at `~/.local/bin` on the host only).

      obsidian correctly identified she could not execute the bead's
      `helm uninstall` + `bash up.sh` + `kubectl exec`/`logs` steps
      and closed vco-ow8.10 as "no-changes: host-only operation",
      filing escalation hq-wisp-uf9hl. The overseer then ran the
      redeploy on the host.

      This is a model-level gap for Track 3 of the plan:
      "Per-phase ops validation" (sfu-update/PLAN.md → "Concrete
      next deliverables → Track 3"). Every per-phase ops-validation
      step that deploys against the local cluster currently hits this
      wall and the overseer has to step in. The dev/ops agent split
      breaks down at the kubectl boundary.

      ## Options

      A. **Mount docker socket + kubeconfig into the polecat sandbox.**
         Simplest fix. Edit `/mnt/llms/gas-town/docker-compose.override.yml`
         to add:

             volumes:
               - /var/run/docker.sock:/var/run/docker.sock:ro
               - /home/malexander/.kube:/home/agent/.kube:ro
               - /home/malexander/.local/bin/k3d:/usr/local/bin/k3d:ro
               - /home/malexander/.local/bin/kubectl:/usr/local/bin/kubectl:ro
               - /home/malexander/.local/bin/helm:/usr/local/bin/helm:ro

         Trade-off: any polecat (current or future) gets root-on-host
         via docker socket. Acceptable for solo dev; absolutely not for
         multi-user / production.

      B. **Stand up a kind/k3d cluster INSIDE the gastown-sandbox
         container** (DinD or rootless variant) so polecats reach it
         locally without escaping. Heavier; needs Docker-in-Docker
         setup plus binary installs in the sandbox image.

      C. **A "deploy proxy" pattern.** Polecat writes deploy intent
         to a known path (e.g. an `apply.yaml` artifact + a tiny
         marker file); a host-side cron/watcher reconciles it. Highest
         isolation, most operational surface.

      D. **Keep the status quo:** Track 3 cluster-touching work is
         overseer-only by policy. Document the gap. Don't change
         polecat sandboxes.

      ## Recommendation

      Start with **D** (codify the boundary) for the experimental-sfu
      phase. Revisit **A** when the project graduates to a multi-rig
      hosting model where >1 polecat needs cluster access on the same
      shared sandbox. **B** and **C** are over-engineered for a
      single-developer local stack.

      ## Acceptance for D

      - This bead's outcome is a short ADR (e.g.
        `sfu-update/adr/0008-polecat-cluster-access-boundary.md`)
        documenting: (a) the gap, (b) the chosen boundary (overseer
        runs cluster-touching ops; polecats run code authoring + chart
        rewrite), (c) when to revisit. Mark Status: Accepted.
      - sfu-update/PLAN.md "Track 3" gets a one-line note pointing at
        the ADR.
      - obsidian's escalation hq-wisp-uf9hl gets closed with a link
        to the ADR.
    parent_epic: ops-epic
    blocked_by: []
