# Local-only ingress for the WebTransport health endpoint.
#
# The webtransport pod listens on UDP/443 for QUIC and TCP/444 for the
# /healthz endpoint (HEALTH_LISTEN_URL=0.0.0.0:444 — see
# helm/rustlemania-webtransport/values-local.yaml).
#
# In production, /healthz is reached via the DigitalOcean LB which has
# a TCP listener on port 444 (do-loadbalancer-healthcheck-port=444 in
# loadBalancerAnnotations). Locally the LB stays Pending (klipper is
# disabled in up.sh's k3d cluster spec), so we route /healthz through
# the nginx Ingress controller instead — same hostname the bead asks
# us to curl: https://transport.videocall.local/healthz.
#
# The Ingress backends to the `rustlemania-webtransport-lb` Service
# (created by helm/rustlemania-webtransport/templates/loadbalancer.yaml,
# port=444, name=wt-api-health). The fact that the Service is type
# LoadBalancer with no provisioner is fine — it still has a ClusterIP
# and endpoints, which is all nginx Ingress needs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustlemania-webtransport-health
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: local-selfsigned
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: transport-videocall-local-ingress-tls
      hosts:
        - transport.videocall.local
  rules:
    - host: transport.videocall.local
      http:
        paths:
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: rustlemania-webtransport-lb
                port:
                  number: 444
