apiVersion: apps/v1
kind: StatefulSet
metadata:
  # Name is load-bearing: helm/local/up.sh does
  # `kubectl rollout status statefulset/postgres-postgresql`. With release
  # name `postgres` this evaluates to `postgres-postgresql`.
  name: {{ include "rustlemania-postgres.statefulsetName" . }}
  labels:
    {{- include "rustlemania-postgres.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Headless governing service is the same ClusterIP Service we use for
  # client traffic — its selector matches these pods. Pod DNS resolves
  # via that Service.
  serviceName: {{ .Values.service.name }}
  selector:
    matchLabels:
      {{- include "rustlemania-postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustlemania-postgres.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.secretKeys.userPasswordKey | default "password" | quote }}
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
            # PGDATA lives in a subdirectory of the volume mount so the
            # official image's initdb is happy: it refuses to initialize
            # into a non-empty mountpoint (e.g. PVC `lost+found`).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rustlemania-postgres.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
