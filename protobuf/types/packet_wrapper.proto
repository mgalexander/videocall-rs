syntax = "proto3";

message PacketWrapper {
  enum PacketType {
    PACKET_TYPE_UNKNOWN = 0;
    RSA_PUB_KEY = 1;
    AES_KEY = 2;
    MEDIA = 3;
    CONNECTION = 4;
    DIAGNOSTICS = 5;
    HEALTH = 6;
    MEETING = 7;
    SESSION_ASSIGNED = 8;
    CONGESTION = 9;
    SUBSCRIPTION_UPDATE = 10;
    SPEAKER_UPDATE = 11;
    LAYER_HINT = 12;
    ADMISSION_DECISION = 13;
    CAPABILITY_ANNOUNCE = 14;
  }
  
  PacketType packet_type = 1;
  bytes user_id = 2;
  bytes data = 3;
  uint64 session_id = 4;
}
